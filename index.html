<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayWorkV3 업데이트 이력</title>
<meta name="description" content="RayWorkV3 버전별 업데이트 이력">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  버전 추가/활성화 방법
  - 새 버전 페이지를 만들면 아래 .versions 안의 카드를 복사해 href 와 data-src 를 그 페이지 파일명으로 바꿉니다.
  - 1.2 이력 페이지가 생기면 1.2 카드의 <div class="ver is-pending"> 를
    <a class="ver" href="RayWorkV3_1.2_Update.html" data-src="RayWorkV3_1.2_Update.html"> 로 바꾸고 1.3 카드와 같은 구성으로 채웁니다.
  - 카드의 최신 빌드·최종 갱신·건수는 연결된 페이지의 UPDATES 데이터에서 자동으로 읽어옵니다.
-->
<style>
/* Layout: one centered 820px column — title block, then a two-up row of version cards (stacks on phones). */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #141922;
  --ink-2: #384354;
  --muted: #5E6878;
  --line: #DEE3EA;
  --line-strong: #C3CBD7;
  --accent: #2450C6;
  --accent-soft: #E6ECFA;
  --font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218;
    --surface: #151B24;
    --ink: #E6EAF0;
    --ink-2: #C3CBD8;
    --muted: #96A1B3;
    --line: #252E3B;
    --line-strong: #364256;
    --accent: #88A9FF;
    --accent-soft: #1B2642;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218;
  --surface: #151B24;
  --ink: #E6EAF0;
  --ink-2: #C3CBD8;
  --muted: #96A1B3;
  --line: #252E3B;
  --line-strong: #364256;
  --accent: #88A9FF;
  --accent-soft: #1B2642;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: clamp(40px, 9vh, 96px) 48px;
}

.eyebrow {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 12px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
}
.eyebrow svg { flex: none; }
h1 {
  margin: 0;
  font-size: clamp(26px, 4.2vw, 36px);
  line-height: 1.25;
  letter-spacing: -0.022em;
  font-weight: 760;
  text-wrap: balance;
}
.lede { margin: 10px 0 0; color: var(--muted); max-width: 56ch; }

.versions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 36px;
}
@media (max-width: 620px) { .versions { grid-template-columns: minmax(0, 1fr); } }

.ver {
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
  padding: 22px 22px 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, box-shadow .15s;
}
a.ver:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
a.ver:focus-visible { outline-offset: 2px; }

.ver-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ver-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--muted); }
.badge {
  font-size: 12px; font-weight: 600; line-height: 20px;
  padding: 0 8px; border-radius: 4px; white-space: nowrap;
}
.badge-latest { color: var(--accent); background: var(--accent-soft); }
.badge-pending { color: var(--muted); border: 1px solid var(--line-strong); }

.ver-num {
  margin: -6px 0 0;
  font-family: var(--font-mono); font-weight: 600;
  font-size: 52px; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.ver-num small { font-size: 18px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }

.ver-meta {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 0; padding-top: 14px;
  border-top: 1px solid var(--line);
}
.ver-meta div { min-width: 0; }
.ver-meta dt { font-size: 12px; color: var(--muted); }
.ver-meta dd {
  margin: 2px 0 0;
  font-family: var(--font-mono); font-size: 13.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.ver-cta {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 650; color: var(--accent);
}
.ver-cta svg { transition: transform .15s; }
a.ver:hover .ver-cta svg { transform: translateX(3px); }

.ver.is-pending { border-style: dashed; border-color: var(--line-strong); background: transparent; }
.ver.is-pending .ver-num { color: var(--muted); }
.ver-note { margin: 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }

.foot { margin-top: 40px; font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">
    <svg width="34" height="12" viewBox="0 0 34 12" aria-hidden="true"><path d="M1 11V1h4v10h3V1h4v10h3V1h4v10h3V6h3v5h2V8h2v3h1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    RayWorkV3 · Release Notes
  </p>
  <h1>RayWorkV3 업데이트 이력</h1>
  <p class="lede">버전을 선택하면 해당 버전의 기능 추가, 개선·변경, 버그 수정 내역을 볼 수 있습니다.</p>

  <div class="versions">
    <!-- RayWorkV3 1.2 : 이력 페이지 준비 중 -->
    <div class="ver is-pending" aria-disabled="true">
      <div class="ver-top">
        <span class="ver-name">RayWorkV3_1.2</span>
        <span class="badge badge-pending">준비 중</span>
      </div>
      <p class="ver-num">1.2<small>.x</small></p>
      <p class="ver-note">업데이트 이력이 아직 등록되지 않았습니다.</p>
    </div>

    <!-- RayWorkV3 1.3 -->
    <a class="ver" href="RayWorkV3_1.3_Update.html" data-src="RayWorkV3_1.3_Update.html">
      <div class="ver-top">
        <span class="ver-name">RayWorkV3_1.3</span>
        <span class="badge badge-latest">최신</span>
      </div>
      <p class="ver-num">1.3<small>.1.x</small></p>
      <dl class="ver-meta">
        <div><dt>최신 빌드</dt><dd data-k="build">1.3.1.139</dd></div>
        <div><dt>최종 갱신</dt><dd data-k="date">2026-11-19</dd></div>
        <div><dt>업데이트</dt><dd data-k="count">48건</dd></div>
      </dl>
      <span class="ver-cta">업데이트 이력 보기
        <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6h15M11 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </div>

  <p class="foot">Rayxion · RayWorkV3</p>
</main>

<script>
// 각 버전 카드의 요약(최신 빌드·최종 갱신·건수)을 연결된 이력 페이지의 UPDATES 데이터에서 읽어와 갱신
document.querySelectorAll('a.ver[data-src]').forEach(card => {
  fetch(card.dataset.src, { cache: 'no-cache' })
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(text => {
      const start = text.indexOf('const UPDATES');
      if (start < 0) return;
      const data = text.slice(start, text.indexOf('\n];', start));
      const build = data.match(/build:\s*'([^']+)'/);
      const dates = [...data.matchAll(/date:\s*'(\d{4}-\d{2}-\d{2})'/g)].map(m => m[1]).sort();
      const set = (k, v) => { const el = card.querySelector(`[data-k="${k}"]`); if (el && v) el.textContent = v; };
      if (build) set('build', build[1]);
      if (dates.length) { set('date', dates[dates.length - 1]); set('count', dates.length + '건'); }
    })
    .catch(() => {});
});
</script>
</body>
</html>
